name: Latest Medium articles

# Runs on demand only. main is protected, so changes go through a pull request.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    name: Open PR with latest Medium articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README from Medium RSS
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://medium.com/feed/@dneprokos"
          max_post_count: 5
          template: "- [$title]($url) — $date $newline"
          date_format: "mmm yyyy"
          skip_commit: true

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/medium-articles
          delete-branch: true
          commit-message: "docs: update latest Medium articles"
          title: "docs: update latest Medium articles"
          body: "Automated update of the Latest Articles section from the Medium RSS feed."
          add-paths: README.md
